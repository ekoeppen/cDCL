name: C/C++ CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  # Full build, test and coverage report workflow for Ubuntu and macOS
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v6
    - name: Install dependencies
      run: |
        (which apt-get && sudo apt-get install perl lcov) || (which brew && brew install lcov) || echo
    - name: configure
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Debug -DCODE_COVERAGE=ON
    - name: build
      run: |
        cd build
        cmake --build .
    - name: Run tests (optional tests excluded)
      run: |
        cd build
        ctest . -C Debug -LE optional
    - name: process and upload coverage data
      run: |
        cd build
        lcov --capture --directory . --output-file coverage.info --ignore-errors unsupported,unsupported,inconsistent,format,format
        lcov --remove coverage.info '/usr/*' --output-file coverage.info --ignore-errors unused,inconsistent,format
        lcov --remove coverage.info '/Applications/Xcode*.app/*' --output-file coverage.info --ignore-errors unused,inconsistent,format
        lcov --list coverage.info --ignore-errors inconsistent
        bash <(curl -s https://codecov.io/bash) -f coverage.info || echo "Codecov did not collect coverage reports"
    - uses: actions/upload-artifact@v7
      with:
        name: libDCL ${{matrix.os}}
        path: build/libDCL.*
    - uses: actions/upload-artifact@v7
      with:
        name: NSOFtoXML ${{matrix.os}}
        path: build/Sample_Code/NSOFtoXML/NSOFtoXML
    - uses: actions/upload-artifact@v7
      with:
        name: DumpPkgPart ${{matrix.os}}
        path: build/Sample_Code/PackageUtils/DumpPkgPart
    - uses: actions/upload-artifact@v7
      with:
        name: DumpPkgDir ${{matrix.os}}
        path: build/Sample_Code/PackageUtils/DumpPkgDir
    - uses: actions/upload-artifact@v7
      with:
        name: WatsonEnabler ${{matrix.os}}
        path: build/Sample_Code/PackageUtils/WatsonEnabler
    - uses: actions/upload-artifact@v7
      with:
        name: nespackager ${{matrix.os}}
        path: build/Sample_Code/PackageUtils/nespackager
    - uses: actions/upload-artifact@v7
      with:
        name: pbbookmaker ${{matrix.os}}
        path: build/Sample_Code/PackageUtils/pbbookmaker
    - uses: actions/upload-artifact@v7
      with:
        name: ELFtoNTK ${{matrix.os}}
        path: build/Sample_Code/ToolchainUtils/ELFtoNTK
    - uses: actions/upload-artifact@v7
      with:
        name: ELFtoPKG ${{matrix.os}}
        path: build/Sample_Code/ToolchainUtils/ELFtoPKG
    - uses: actions/upload-artifact@v7
      with:
        name: Rex ${{matrix.os}}
        path: build/Sample_Code/ToolchainUtils/Rex

  # Build and test workflow for Cygwin
  build-cygwin:
    runs-on: windows-latest
    steps:
    - name: Disable git autocrlf
      run: git config --global core.autocrlf false

    - name: Checkout source code
      uses: actions/checkout@v6

    - name: Install dependencies
      uses: cygwin/cygwin-install-action@v6
      with:
        packages: gcc-core gcc-g++ cmake ninja perl

    - name: Configure
      shell: bash
      run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      shell: bash
      run: cmake --build build

    - name: Run required tests (optional tests are excluded)
      shell: bash
      run: export PATH="$(pwd):$PATH" && ctest . -C Debug -LE optional
      working-directory: build

    - uses: actions/upload-artifact@v7
      with:
        name: libDCL windows-cygwin
        path: build/libDCL.*
    - uses: actions/upload-artifact@v7
      with:
        name: NSOFtoXML windows-cygwin
        path: build/Sample_Code/NSOFtoXML/NSOFtoXML.exe
    - uses: actions/upload-artifact@v7
      with:
        name: DumpPkgPart windows-cygwin
        path: build/Sample_Code/PackageUtils/DumpPkgPart.exe
    - uses: actions/upload-artifact@v7
      with:
        name: DumpPkgDir windows-cygwin
        path: build/Sample_Code/PackageUtils/DumpPkgDir.exe
    - uses: actions/upload-artifact@v7
      with:
        name: WatsonEnabler windows-cygwin
        path: build/Sample_Code/PackageUtils/WatsonEnabler.exe
    - uses: actions/upload-artifact@v7
      with:
        name: nespackager windows-cygwin
        path: build/Sample_Code/PackageUtils/nespackager.exe
    - uses: actions/upload-artifact@v7
      with:
        name: pbbookmaker windows-cygwin
        path: build/Sample_Code/PackageUtils/pbbookmaker.exe
    - uses: actions/upload-artifact@v7
      with:
        name: ELFtoNTK windows-cygwin
        path: build/Sample_Code/ToolchainUtils/ELFtoNTK.exe
    - uses: actions/upload-artifact@v7
      with:
        name: ELFtoPKG windows-cygwin
        path: build/Sample_Code/ToolchainUtils/ELFtoPKG.exe
    - uses: actions/upload-artifact@v7
      with:
        name: Rex windows-cygwin
        path: build/Sample_Code/ToolchainUtils/Rex.exe
